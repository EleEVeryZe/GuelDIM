name: Deploy Static Website to S3

on:
  push:
    branches:
      - main  # Runs when code is pushed to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build App
        run: |
          npm ci
          npm run build

      # Step 1: Upload the root files (index.html, vite.svg, etc.) and delete anything old in S3
      - name: Sync general files to S3
        run: |
          aws s3 sync ./dist s3://${{ secrets.S3_BUCKET_NAME }}/ --exclude "assets/*" --delete

      # Step 2: Upload JavaScript assets forcing the correct application/javascript MIME type
      - name: Sync JS assets with explicit content-type
        run: |
          aws s3 sync ./dist/assets s3://${{ secrets.S3_BUCKET_NAME }}/assets --exclude "*" --include "*.js" --content-type "application/javascript"

      # Step 3: Upload CSS assets forcing the correct text/css MIME type
      - name: Sync CSS assets with explicit content-type
        run: |
          aws s3 sync ./dist/assets s3://${{ secrets.S3_BUCKET_NAME }}/assets --exclude "*" --include "*.css" --content-type "text/css"

      # Step 4: Clear the CloudFront cache completely so the browser fetches the new index.html
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EI13840A5U13P \
            --paths "/*"